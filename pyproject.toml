[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-lab"
version = "1.0.1"
description = "Read-only laptop battery health logbook for Linux."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juan Manuel Ramallo" }]
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-cov>=7", "hypothesis>=6.170", "ruff>=0.17", "mypy>=2.4", "pip-audit>=2.10"]

[project.scripts]
battery-lab = "battery_lab.cli:main"

[tool.setuptools.packages.find]
include = ["battery_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["statistical: seeded Monte Carlo checks of estimator behavior"]

[tool.coverage.run]
branch = true
source = ["battery_lab"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S311", "S108", "S608"]
"scripts/*" = ["S311", "E402"]
"battery_lab/simulation/*" = ["S311"]
"battery_lab/analysis/robust.py" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["battery_lab"]
