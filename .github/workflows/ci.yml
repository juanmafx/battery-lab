name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/dev.lock"
      - run: python -m ruff check battery_lab collect.py scripts tests
      - run: python -m mypy
      - run: python -m pytest --hypothesis-seed=2026 --cov=battery_lab --cov-branch --cov-report=term
      - run: python -m pip_audit --require-hashes --disable-pip -r requirements/dev.lock
