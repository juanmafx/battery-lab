<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0b849" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f0b849" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="#0e1014"/>

  <text x="72" y="74" fill="#6b7280" font-size="13" letter-spacing="3.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02 — THE MECHANISM</text>
  <text x="72" y="130" fill="#f5f5f4" font-size="40" font-weight="600" letter-spacing="-0.8">This is what working looks like.</text>
  <text x="72" y="166" fill="#6b7280" font-size="16">Plugged in all day. The firmware never lets the cells sit full.</text>
  <line x1="72" y1="200" x2="1128" y2="200" stroke="#22262e" stroke-width="1"/>

  <g transform="translate(150,300)">
    <!-- comfort band -->
    <rect x="0" y="0" width="880" height="150" fill="url(#band)"/>
    <line x1="0" y1="0" x2="880" y2="0" stroke="#f0b849" stroke-width="1" stroke-dasharray="5 5" opacity="0.55"/>
    <line x1="0" y1="150" x2="880" y2="150" stroke="#f0b849" stroke-width="1" stroke-dasharray="5 5" opacity="0.55"/>

    <text x="-16" y="5" fill="#f0b849" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">75%</text>
    <text x="-16" y="155" fill="#f0b849" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">60%</text>
    <text x="-16" y="-58" fill="#3f4650" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">100%</text>
    <line x1="0" y1="-63" x2="880" y2="-63" stroke="#2b313b" stroke-width="1" stroke-dasharray="2 6"/>
    <text x="0" y="-76" fill="#3f4650" font-size="12">never reached — by design</text>

    <!-- the cycle line: fast charge, long hold, slow drift -->
    <path d="M0,150 L60,0 L250,0 L420,150 L480,0 L670,0 L840,150 L880,150"
          fill="none" stroke="#f0b849" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- stage markers -->
    <circle cx="30" cy="75" r="4.5" fill="#6ee7b7"/>
    <circle cx="150" cy="0" r="4.5" fill="#60a5fa"/>
    <circle cx="335" cy="75" r="4.5" fill="#a78bfa"/>

    <!-- x axis -->
    <line x1="0" y1="185" x2="880" y2="185" stroke="#22262e" stroke-width="1"/>
    <text x="0" y="208" fill="#4b5563" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">time on AC power</text>
  </g>

  <!-- three stages -->
  <g transform="translate(150,548)">
    <rect x="0" y="-18" width="3" height="60" fill="#6ee7b7"/>
    <text x="16" y="0" fill="#6ee7b7" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Charging</text>
    <text x="16" y="22" fill="#9ca3af" font-size="13">From 60% up to 75%.</text>
    <text x="16" y="42" fill="#4b5563" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">current_now: high</text>
  </g>
  <g transform="translate(470,548)">
    <rect x="0" y="-18" width="3" height="60" fill="#60a5fa"/>
    <text x="16" y="0" fill="#60a5fa" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Not charging</text>
    <text x="16" y="22" fill="#9ca3af" font-size="13">Hit 75%. Laptop runs on AC.</text>
    <text x="16" y="42" fill="#4b5563" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">current_now: ~1 mA</text>
  </g>
  <g transform="translate(790,548)">
    <rect x="0" y="-18" width="3" height="60" fill="#a78bfa"/>
    <text x="16" y="0" fill="#a78bfa" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Discharging</text>
    <text x="16" y="22" fill="#9ca3af" font-size="13">Drifting down. Still plugged in.</text>
    <text x="16" y="42" fill="#4b5563" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">current_now: low</text>
  </g>

  <text x="1128" y="74" fill="#3f4650" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">battery-lab</text>
</svg>
