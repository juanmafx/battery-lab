<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1200" height="660" fill="#0e1014"/>

<text x="72" y="66" fill="#6b7280" font-size="13" letter-spacing="3.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04 — THE PROOF</text>
<text x="72" y="120" fill="#f5f5f4" font-size="40" font-weight="600" letter-spacing="-0.8">cat gives you one number.</text>
<text x="72" y="168" fill="#f0b849" font-size="40" font-weight="600" letter-spacing="-0.8">battery-lab gives you the trend.</text>
<line x1="72" y1="206" x2="1128" y2="206" stroke="#22262e"/>

<g transform="translate(72,246)">
<text x="0" y="0" fill="#6b7280" font-size="12" letter-spacing="2.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">WITHOUT BATTERY-LAB</text>
<rect x="0" y="18" width="452" height="300" rx="6" fill="#14171d" stroke="#22262e"/>
<text x="26" y="58" fill="#4b5563" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$ cat /sys/class/power_supply/</text>
<text x="26" y="76" fill="#4b5563" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">      BAT0/capacity</text>
<text x="26" y="100" fill="#9ca3af" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">76</text>
<text x="26" y="140" fill="#4b5563" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$ cat .../BAT0/status</text>
<text x="26" y="164" fill="#9ca3af" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Not charging</text>
<line x1="26" y1="200" x2="426" y2="200" stroke="#22262e"/>
<text x="26" y="232" fill="#6b7280" font-size="14">Two numbers, one instant.</text>
<text x="26" y="258" fill="#4b5563" font-size="13">Is the 75% ceiling holding?</text>
<text x="26" y="280" fill="#4b5563" font-size="13">How fast is it wearing out?</text>
<text x="26" y="302" fill="#4b5563" font-size="13">Is heat making it worse?</text>
</g>

<g transform="translate(566,380)">
<line x1="0" y1="0" x2="40" y2="0" stroke="#f0b849" stroke-width="2"/>
<path d="M40,-6 L52,0 L40,6 Z" fill="#f0b849"/>
</g>

<g transform="translate(648,246)">
<text x="0" y="0" fill="#f0b849" font-size="12" letter-spacing="2.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">WITH BATTERY-LAB</text>
<rect x="0" y="18" width="480" height="300" rx="6" fill="#14171d" stroke="#33383f"/>
<text x="24" y="54" fill="#4b5563" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$ battery-lab show</text>
<text x="24" y="82" fill="#6b7280" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">EXAMPLE-ID / BAT0  (DELL 9077G0C, Li-poly)</text>
<text x="24" y="106" fill="#9ca3af" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  samples        5</text>
<text x="24" y="126" fill="#9ca3af" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  span           32m</text>
<text x="24" y="146" fill="#f0b849" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  health         83.64% -&gt; 83.64%</text>
<text x="24" y="166" fill="#9ca3af" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  full capacity  2956 mAh of 3534 design</text>
<text x="24" y="186" fill="#9ca3af" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  cycle count    not reported by firmware</text>
<text x="24" y="206" fill="#9ca3af" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  temp_c         min 93 / med 95 / max 97</text>
<text x="24" y="232" fill="#6b7280" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  time by status</text>
<text x="24" y="252" fill="#9ca3af" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">    Charging         29m   89.5%</text>
<text x="24" y="272" fill="#9ca3af" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">    Not charging      3m   10.5%</text>
<line x1="24" y1="292" x2="456" y2="292" stroke="#22262e"/>
<text x="24" y="312" fill="#f0b849" font-size="13.5" font-weight="600">Evidence, not assumption.</text>
</g>

<g transform="translate(72,610)">
<text x="0" y="0" fill="#3f4650" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text>
<text x="26" y="0" fill="#f5f5f4" font-size="15" font-weight="600">0</text>
<text x="42" y="0" fill="#6b7280" font-size="13">dependencies</text>
<text x="210" y="0" fill="#3f4650" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text>
<text x="236" y="0" fill="#f5f5f4" font-size="15" font-weight="600">0</text>
<text x="252" y="0" fill="#6b7280" font-size="13">writes to your system</text>
<text x="480" y="0" fill="#3f4650" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03</text>
<text x="506" y="0" fill="#f5f5f4" font-size="15" font-weight="600">0</text>
<text x="522" y="0" fill="#6b7280" font-size="13">sudo required</text>
<text x="700" y="0" fill="#3f4650" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04</text>
<text x="726" y="0" fill="#f5f5f4" font-size="15" font-weight="600">100%</text>
<text x="778" y="0" fill="#6b7280" font-size="13">of the data stays on your disk</text>
</g>
<text x="1128" y="66" fill="#3f4650" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">battery-lab</text>
</svg>