<text x="72" y="120" fill="#f5f5f4" font-size="40" font-weight="600" letter-spacing="-0.8">Stress is exponential, not linear.</text>
<text x="72" y="154" fill="#6b7280" font-size="16">The last 15% of the charge does more damage than the first 60% combined.</text>
