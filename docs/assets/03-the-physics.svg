<text x="72" y="668" fill="#f0b849" font-size="15" font-weight="600">Nobody drives at 6,500 RPM all day.</text>
<text x="404" y="668" fill="#6b7280" font-size="14">Normal is 1,500–2,700. Yet we pin batteries at 100% and wonder why they die.</text>
