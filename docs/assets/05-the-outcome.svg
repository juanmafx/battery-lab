<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="620" fill="#0e1014"/>

  <text x="72" y="70" fill="#6b7280" font-size="13" letter-spacing="3.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">05 — THE OUTCOME</text>
  <text x="72" y="124" fill="#f5f5f4" font-size="40" font-weight="600" letter-spacing="-0.8">One setting. Same speed. Nearly triple the life.</text>
  <line x1="72" y1="164" x2="1128" y2="164" stroke="#22262e"/>

  <!-- LEFT: default -->
  <g transform="translate(72,206)">
    <rect x="0" y="0" width="494" height="300" rx="8" fill="#15100e" stroke="#3a221b" stroke-width="1"/>

    <text x="32" y="44" fill="#8a5a44" font-size="12" letter-spacing="2.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DEFAULT — CHARGE TO 100%</text>

    <text x="32" y="136" fill="#f0764b" font-size="86" font-weight="700" letter-spacing="-3">3.2</text>
    <text x="188" y="136" fill="#8a5a44" font-size="24" font-weight="500">years</text>
    <text x="32" y="166" fill="#6b7280" font-size="14">until the battery drops below 70% and needs replacing</text>

    <line x1="32" y1="196" x2="462" y2="196" stroke="#2a1c17"/>

    <text x="32" y="228" fill="#6b7280" font-size="13">Annual loss rate</text>
    <text x="462" y="228" fill="#f0764b" font-size="13" text-anchor="end" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">9% and compounding</text>

    <text x="32" y="256" fill="#6b7280" font-size="13">Cell voltage at rest</text>
    <text x="462" y="256" fill="#f0764b" font-size="13" text-anchor="end" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">maximum, all day</text>

    <text x="32" y="284" fill="#6b7280" font-size="13">CPU performance</text>
    <text x="462" y="284" fill="#9ca3af" font-size="13" text-anchor="end" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">100%</text>
  </g>

  <!-- RIGHT: capped -->
  <g transform="translate(634,206)">
    <rect x="0" y="0" width="494" height="300" rx="8" fill="#0f1613" stroke="#1e3a30" stroke-width="1"/>

    <text x="32" y="44" fill="#4d8c74" font-size="12" letter-spacing="2.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CAPPED — CHARGE 60–75%</text>

    <text x="32" y="136" fill="#6ee7b7" font-size="86" font-weight="700" letter-spacing="-3">8.9</text>
    <text x="188" y="136" fill="#4d8c74" font-size="24" font-weight="500">years</text>
    <text x="32" y="166" fill="#6b7280" font-size="14">same threshold, same workload, same laptop</text>

    <line x1="32" y1="196" x2="462" y2="196" stroke="#17251f"/>

    <text x="32" y="228" fill="#6b7280" font-size="13">Annual loss rate</text>
    <text x="462" y="228" fill="#6ee7b7" font-size="13" text-anchor="end" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~3.5% and flat</text>

    <text x="32" y="256" fill="#6b7280" font-size="13">Cell voltage at rest</text>
    <text x="462" y="256" fill="#6ee7b7" font-size="13" text-anchor="end" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mid-range</text>

    <text x="32" y="284" fill="#6b7280" font-size="13">CPU performance</text>
    <text x="462" y="284" fill="#9ca3af" font-size="13" text-anchor="end" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">100% — unchanged</text>
  </g>

  <!-- what you give up -->
  <g transform="translate(72,552)">
    <text x="0" y="0" fill="#6b7280" font-size="13">What you give up:</text>
    <text x="132" y="0" fill="#f5f5f4" font-size="13" font-weight="600">25–40% of peak runtime on battery.</text>
    <text x="418" y="0" fill="#6b7280" font-size="13">Nothing else. Not one clock cycle.</text>
  </g>
  <text x="72" y="582" fill="#3f4650" font-size="11">Projection from a compounding-loss model. Your own numbers come from your own log.</text>

  <text x="1128" y="70" fill="#3f4650" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">battery-lab</text>
</svg>
